services:
  - type: web
    name: mundial-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: SHADOW_MODE
        value: "false"
      - key: PUBLICATION_MIN_CLOSED_PICKS
        value: "80"
      - key: PUBLICATION_MIN_CLV_SAMPLE
        value: "50"
      - key: PUBLICATION_MIN_ROI
        value: "2.0"
      - key: PUBLICATION_MIN_HIT_RATE
        value: "52.0"
      - key: PUBLICATION_MIN_CLV_POSITIVE_PCT
        value: "52.0"
      - key: PUBLICATION_MIN_MODEL_EVALS
        value: "60"
      - key: ODDS_PROVIDER
        value: the_odds_api
      - key: REFERENCE_BOOKMAKER
        value: Pinnacle
      - key: TELEGRAM_AUTOPUBLISH_ENABLED
        value: "true"
      - key: TELEGRAM_AUTOPUBLISH_INTERVAL_HOURS
        value: "6"
      - key: TELEGRAM_AUTOPUBLISH_DEPORTE
        value: todo
      - key: TELEGRAM_AUTOPUBLISH_PERFIL
        value: alto_riesgo
      - key: TELEGRAM_AUTOPUBLISH_MODO
        value: pinnacle
      - key: TELEGRAM_AUTOPUBLISH_MERCADOS
        value: todo
      - key: TELEGRAM_AUTOPUBLISH_PARTIDO
        value: todos
      - key: TELEGRAM_AUTOPUBLISH_SOLO_STAKAZOS
        value: "false"
